services:
  postgres:
    image: postgres:16
    container_name: xylem-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: xylem
    ports:
      - "5433:5432"
    volumes:
      - xylem_db_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  xylem_db_data:
